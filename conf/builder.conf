# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_gpio drives the agent's GPIO/I2C/SPI over its
# RPC server, so the suite has a real agent with an RPC server, and the
# libgpiod/ioctl code lives in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test: ta_gpio and rpcs_gpio onto the agent
# (listed again in the RPC server application below), tapi_gpio onto the
# engine. Functional - no tsf-cybersec chain.
TE_EXT_REPO_USE([tsf_gpio], [ta_gpio rpcs_gpio], [tapi_gpio])

# The gpio_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_gpio/gpio_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_gpio/gpio_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_gpio's RPCs run here, so it links the
# agent-side ta_gpio (GPIO over libgpiod, I2C/SPI over the kernel ioctls)
# and rpcs_gpio on top of the stock RPC server. The agent host must carry
# libgpiod (dev) and expose /dev/gpiochip*, /dev/i2c-*, /dev/spidev*.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_gpio rpcs_gpio \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
